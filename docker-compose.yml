# One command to run the whole thing:
#
#   docker compose up --build
#
# Then open http://localhost:4200 for the app and http://localhost:5080/swagger
# for the API.
#
# This exists so a reviewer who does not have the .NET 8 SDK and Node 20 on
# their machine can still see the project run. Running it locally (see README)
# is faster and gives you hot reload, so that is still the recommended loop.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: orderintake-api
    environment:
      # SQLite rather than the in-memory store: a container restart should not
      # lose the orders a reviewer just created. It also exercises the real
      # unique index, which the EF in-memory provider quietly ignores.
      Storage__Provider: Sqlite
      Storage__SqliteConnectionString: Data Source=/data/orderintake.db
      Storage__SeedSampleData: "true"
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - api-data:/data
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: orderintake-web
    ports:
      - "4200:80"
    depends_on:
      api:
        # Waiting for healthy, not just started: nginx resolves the `api`
        # hostname when it proxies, and a first request into a container that
        # is still warming up is a confusing way to meet the app.
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  api-data:
